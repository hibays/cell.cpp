# Manual release pipeline: workflow_dispatch -> build all platforms -> publish
# a GitHub release with the packaged binaries attached.
#
#   gh workflow run release.yml -R hibays/cell.cpp -f tag=v0.1.0
#
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0) — must not already exist"
        required: true
        type: string
      title:
        description: "Release title (defaults to the tag)"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Package · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-msvc
            os: windows-2022
            shell: pwsh
            cmake_extra: -DCELL_BUILD_STATIC=ON
            pkg: zip
          - name: linux-x64-gcc14
            os: ubuntu-24.04
            shell: bash
            cmake_extra: -DCMAKE_CXX_COMPILER=g++-14 -DCELL_BUILD_STATIC=ON
            pkg: tar
          - name: macos-arm64-appleclang
            os: macos-15
            shell: bash
            cmake_extra: -DCELL_BUILD_STATIC=ON
            pkg: tar
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-14 python3 \
            libcurl4-openssl-dev libsodium-dev nlohmann-json3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libsodium nlohmann-json

      - name: Install dependencies (Windows MSVC)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: 3dd44b17ecb69a268d0b04daa9d0748f3ea9b587

      - name: Configure
        shell: ${{ matrix.shell }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCELL_BUILD_CLI=ON
          -DCELL_BUILD_SHARED=OFF
          -DCELL_BUILD_WEBUI=OFF
          ${{ matrix.cmake_extra }}

      - name: Build
        shell: ${{ matrix.shell }}
        run: cmake --build build --parallel

      - name: Test (the self-test must stay fast on every platform)
        shell: ${{ matrix.shell }}
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: ${{ matrix.shell }}
        run: |
          New-Item -ItemType Directory -Force -Path pkg/cell-${{ inputs.tag }} | Out-Null
          Copy-Item build/bin/cell.exe pkg/cell-${{ inputs.tag }}/
          Copy-Item README.md LICENSE pkg/cell-${{ inputs.tag }}/
          Compress-Archive -Path pkg/cell-${{ inputs.tag }} `
            -DestinationPath cell-${{ inputs.tag }}-windows-x64-msvc.zip
        if: matrix.name == 'windows-x64-msvc'

      - name: Package (posix)
        if: matrix.name != 'windows-x64-msvc'
        shell: ${{ matrix.shell }}
        run: |
          mkdir -p pkg/cell-${{ inputs.tag }}
          cp build/bin/cell pkg/cell-${{ inputs.tag }}/
          cp README.md LICENSE pkg/cell-${{ inputs.tag }}/
          tar -czf cell-${{ inputs.tag }}-${{ matrix.name }}.tar.gz -C pkg cell-${{ inputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ inputs.tag }}-${{ matrix.name }}
          path: |
            cell-${{ inputs.tag }}-windows-x64-msvc.zip
            cell-${{ inputs.tag }}-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="$FLAGS --prerelease"
          gh release create "$TAG" dist/* --title "${TITLE:-$TAG}" \
            --generate-notes $FLAGS
