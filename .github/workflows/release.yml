# Manual release pipeline: workflow_dispatch -> build all platforms -> publish
# a GitHub release with the packaged binaries attached.
#
#   gh workflow run release.yml -R hibays/cell.cpp -f tag=v0.1.0
#
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0) — must not already exist"
        required: true
        type: string
      title:
        description: "Release title (defaults to the tag)"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Package · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64-windows-static makes vcpkg resolve curl/libsodium/openssl as
          # static .lib files, so cell.exe / cellui.exe ship as self-contained
          # single files (the alternative — packaging a tree of vcpkg DLLs — is
          # exactly what the old, broken one-exe zip was missing).
          - name: windows-x64-msvc
            os: windows-2022
            cmake_extra: -DCELL_BUILD_STATIC=ON -DVCPKG_TARGET_TRIPLET=x64-windows-static
            pkg: zip
          - name: linux-x64-gcc14
            os: ubuntu-24.04
            cmake_extra: -DCMAKE_CXX_COMPILER=g++-14 -DCELL_BUILD_STATIC=ON
            pkg: tar
          - name: macos-arm64-appleclang
            os: macos-15
            cmake_extra: -DCELL_BUILD_STATIC=ON
            pkg: tar
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-14 python3 \
            libcurl4-openssl-dev libsodium-dev nlohmann-json3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libsodium nlohmann-json

      # cellui embeds the built front-end (webui/frontend/dist/index.html), so it
      # must be produced *before* CMake configures: the embed step decides
      # whether to include the real SPA at configure time. The generated header
      # is the thing cell.cellui_boot then asserts contains /webui.js.
      #
      # The installer drops bun in $BUN_INSTALL/bin but only patches the shell
      # profile — writing $GITHUB_PATH does NOT help, because that takes effect
      # for the *next* step and this one still cannot see bun (exit 127). Export
      # the PATH inside this step, and pin BUN_INSTALL so the location is known.
      - name: Build front-end (cellui embeds it)
        shell: bash
        run: |
          export BUN_INSTALL="$HOME/.bun"
          curl -fsSL https://bun.sh/install | bash
          export PATH="$BUN_INSTALL/bin:$PATH"
          command -v bun && bun --version
          cd webui/frontend
          bun install
          bun run build
          test -f dist/index.html || { echo "front-end build produced no dist/index.html"; exit 1; }

      # No -G here on purpose: let CMake pick the installed Visual Studio via
      # vswhere (VS 2022 on the windows-2022 runner, or a newer VS 17/18 on a
      # developer machine). Forcing -G Ninja in a non-VS shell made CMake pick
      # the runner's MinGW c++ and fail on MSVC-only macros. The VS generator is
      # multi-config, so --config Release drives the build and -C Release the test.
      - name: Configure (Windows MSVC — auto-detect installed VS, vcpkg from runner)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCELL_BUILD_CLI=ON
          -DCELL_BUILD_SHARED=OFF
          -DCELL_BUILD_WEBUI=ON
          -DCELL_EMBED_WEBUI=ON
          ${{ matrix.cmake_extra }}

      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCELL_BUILD_CLI=ON
          -DCELL_BUILD_SHARED=OFF
          -DCELL_BUILD_WEBUI=ON
          -DCELL_EMBED_WEBUI=ON
          ${{ matrix.cmake_extra }}

      - name: Build (Windows MSVC)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Build (POSIX)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      # ctest includes cell.cellui_boot, which asserts the shipped cellui binary
      # really carries the front-end built above (and, on Windows, that its icon
      # resource is loadable by id). Set CELLUI_BOOT_TEST=1 to additionally spawn
      # the shell and wait for the in-process kernel; that needs a real display,
      # so it stays off on headless runners.
      - name: Test (Windows MSVC)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          CELL_LLDB: ${{ runner.os == 'macOS' && '1' || '0' }}

      - name: Test (POSIX)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure
        env:
          CELL_LLDB: ${{ runner.os == 'macOS' && '1' || '0' }}

      - name: Package
        if: matrix.name == 'windows-x64-msvc'
        run: |
          New-Item -ItemType Directory -Force -Path pkg/cell-${{ inputs.tag }} | Out-Null
          Copy-Item -Path build/bin/cell.exe -Destination pkg/cell-${{ inputs.tag }}/
          Copy-Item -Path build/bin/cellui.exe -Destination pkg/cell-${{ inputs.tag }}/
          Copy-Item -Path README.md -Destination pkg/cell-${{ inputs.tag }}/
          Copy-Item -Path LICENSE -Destination pkg/cell-${{ inputs.tag }}/
          Copy-Item -Path assets/brand -Destination pkg/cell-${{ inputs.tag }}/brand -Recurse
          Compress-Archive -Path pkg/cell-${{ inputs.tag }} -DestinationPath cell-${{ inputs.tag }}-windows-x64-msvc.zip

      - name: Package (posix)
        if: matrix.name != 'windows-x64-msvc'
        run: |
          mkdir -p pkg/cell-${{ inputs.tag }}
          cp build/bin/cell pkg/cell-${{ inputs.tag }}/
          cp build/bin/cellui pkg/cell-${{ inputs.tag }}/
          cp README.md LICENSE pkg/cell-${{ inputs.tag }}/
          cp -r assets/brand pkg/cell-${{ inputs.tag }}/brand
          tar -czf cell-${{ inputs.tag }}-${{ matrix.name }}.tar.gz -C pkg cell-${{ inputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ inputs.tag }}-${{ matrix.name }}
          path: |
            cell-${{ inputs.tag }}-windows-x64-msvc.zip
            cell-${{ inputs.tag }}-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes shells out to git for the repo
      # context and the auto-generated notes, so the release job must have a
      # checkout (download-artifact alone leaves no .git directory).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="$FLAGS --prerelease"
          gh release create "$TAG" dist/* --title "${TITLE:-$TAG}" \
            --generate-notes $FLAGS
